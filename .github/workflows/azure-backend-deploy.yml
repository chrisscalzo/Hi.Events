name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  APP_NAME: 'whiskey-fest-backend'
  PHP_VERSION: '8.2'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: intl, mbstring, pdo_mysql, pdo_pgsql, zip, gd, bcmath
        tools: composer:v2
        coverage: none
        
    - name: Validate composer.json
      working-directory: ./backend
      run: composer validate --strict
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
        
    - name: Prepare Laravel application
      working-directory: ./backend
      run: |
        # Create required directories
        mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        mkdir -p storage/app/public storage/app/htmlpurifier
        mkdir -p bootstrap/cache
        
        # Set permissions
        chmod -R 775 storage bootstrap/cache
        
        # Create .env file from Azure App Settings (will be populated by Azure)
        touch .env
        
    - name: Create deployment package
      working-directory: ./backend
      run: |
        # Remove dev dependencies and unnecessary files
        rm -rf tests/
        rm -rf .git/
        rm -rf node_modules/
        rm -f .env.example .env.testing phpunit.xml
        
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.APP_NAME }}
        slot-name: 'production'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./backend
