worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    upstream php_backend {
        server unix:/var/run/php/php-fpm.sock;
    }

    upstream node_frontend {
        server 127.0.0.1:5678;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /home/site/wwwroot;

        index index.php index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API routes - Laravel PHP backend
        location ~ ^/api {
            try_files $uri $uri/ /backend/public/index.php?$query_string;
        }

        # Storage routes - serve from backend storage
        location ~ ^/storage {
            alias /home/site/wwwroot/backend/storage/app/public;
            try_files $uri =404;
        }

        # Laravel public assets
        location ~ ^/(css|js|images|fonts|favicon\.ico|robots\.txt) {
            root /home/site/wwwroot/backend/public;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Process PHP files for Laravel
        location ~ \.php$ {
            root /home/site/wwwroot/backend/public;
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param PHP_VALUE "upload_max_filesize=50M \n post_max_size=50M";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 4 32k;
        }

        # Frontend - React Router SSR (all other routes)
        location / {
            proxy_pass http://node_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # WebSocket support for frontend
        location /ws {
            proxy_pass http://node_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
